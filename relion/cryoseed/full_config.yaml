io:
  star_path: ""
  data_path: ""
  ref_volume_path: ""
  output_path: outputs
  ssd_cache_root: outputs/ssd_cache

data:
  batch_size: 4
  num_workers: 0
  num_particles: 0
  image_size: 0
  angpix: 0.0
  particle_diameter: null
  default_optic_params:
    voltage_kv: null
    spherical_aberration_mm: null
    ctf_bfactor: null
    ctf_scale: null
    amplitude_contrast: null
    phase_shift_deg: null
  default_particle_params:
    defocus_u_angstrom: null
    defocus_v_angstrom: null
    defocus_angle_deg: null

logging:
  log_dir: outputs/logs
  log_prefix: cryoseed
  level: INFO

reproduce:
  seed: 42
  deterministic: false

modules:
  volume:
    num_volumes: 1
    voxel:
      backproject_chunk: 16384
      full_backprojection: false
      learning_rate: 1.0
      learning_rate_decay: 0.9995
      momentum: 0.9

  search:
    init_healpix_order: 2
    neighbor_steps: 2
    init_trans_grid_extent: null
    trans_grid_samples: 5
    trans_grid_x_shift: 0
    trans_grid_y_shift: 0
    pose_chunk_factor: 2560
    max_candidates: -1
    criterion_chunk: 8192
    candidate_select_threshold: 0.999
    volume_class_similarity: 0.0
    volume_class_similarity_scope: global
    oversampling_deduplicate: false
    ring_averaged_mse: false
    particle_mask:
      enabled: false
      zero_mask: true
      soft_edge_pixels: 5.0
      protection_disable_epochs: 5
      protection_radius_factor: 2.6282608848784657

  statistics:
    noise:
      enabled: true
      accumulate_chunk: 16384
      init_variance: 1.0
      precision_eps: 1e-06
      ema_decay: 0.0
      prior_weight: 0.0
      inflated_weight: 0.0
      inflated_decay: null
      inflated_scale: 8.0

    prior:
      enabled: true
      init_variance: 1.0
      precision_eps: 1e-06
      tail_floor: 1e-05
      init_lowpass_cutoff: null

abinitio:
  engine:
    num_epochs: 1000
    init_particles_per_volume: 100
    init_lowpass_angstrom: 50
    solvent_mask: none
    solvent_mask_soft_edge_pixels: 5.0
    loss_ema_decay: 0.9
    pose_rms_ema_decay: 0.9

  scheduler:
    schedule_check_interval_iters: 100
    confidence_threshold: 0.5
    convergence_patience: 3
    pose_translation_center_mode: auto
    increase_radius_step: 1
    auto_local_healpix_order: 4
    auto_local_assignment_change_threshold: 1.0
    trans_extent_scale: 3.0
    target_side_length_resolution: 10.0
    target_healpix_order: null
    pose_rotation_stability_factor: 1.0
    pose_translation_stability_factor: 0.5

heterorefine:
  engine:
    num_epochs: 25
    init_lowpass_angstrom: 30
    first_epoch_ncc: true
    solvent_mask: none
    solvent_mask_soft_edge_pixels: 5.0

  scheduler:
    increase_radius_step: 10
    dvp_threshold: 1.0
    pose_translation_center_mode: auto

homorefine:
  engine:
    num_epochs: 50
    init_lowpass_angstrom: 30
    external_reconstruct: false
    solvent_mask: none
    solvent_mask_soft_edge_pixels: 5.0
    solvent_fsc_correction: false

  scheduler:
    first_epoch_ncc: true
    confidence_threshold: 0.1
    convergence_patience: 3
    fsc_resolution_improvement_threshold: 0.005
    fsc_resolution_rebound_threshold: 0.01
    trans_update_rms_threshold: 0.5
    pose_translation_center_mode: auto
    increase_radius_step: 10
    increase_radius_aggressive_factor: 0.25
    increase_radius_aggressive_fsc_threshold: 0.2
    base_healpix_order: 3
    auto_local_healpix_order: 4
    use_cache: false
    cache_max_healpix_order: 4
    ssd_cache_min_side_length: 150
    trans_extent_scale: 3.0