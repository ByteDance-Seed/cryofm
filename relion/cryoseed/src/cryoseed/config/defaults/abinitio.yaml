io:
  star_path: ""
  data_path: ""
  ref_volume_path: ""
  output_path: outputs
  ssd_cache_root: ""

data:
  batch_size: 4
  num_workers: 0
  num_particles: 0
  image_size: 0
  angpix: 0.0
  particle_diameter: null
  default_optic_params:
    voltage_kv: null
    spherical_aberration_mm: null
    ctf_bfactor: null
    ctf_scale: null
    amplitude_contrast: null
    phase_shift_deg: null
  default_particle_params:
    defocus_u_angstrom: null
    defocus_v_angstrom: null
    defocus_angle_deg: null

logging:
  log_dir: ""
  log_prefix: cryoseed
  level: INFO

reproduce:
  seed: 42
  deterministic: false

modules:
  volume:
    num_volumes: 1
    backproject_chunk: 16384
    full_backprojection: false
  search:
    init_healpix_order: 0
    neighbor_steps: 2
    init_trans_grid_extent: null
    trans_grid_samples: 5
    trans_grid_x_shift: 0
    trans_grid_y_shift: 0
    pose_chunk_factor: 2560
    max_candidates: -1
    criterion_chunk: 8192
    candidate_select_threshold: 0.999
    volume_class_similarity: 0.0
    volume_class_similarity_scope: global
    oversampling_deduplicate: false
    ring_averaged_mse: false
    particle_mask:
      enabled: false
      zero_mask: true
      soft_edge_pixels: 5.0
      protection_disable_epochs: 5
      protection_radius_factor: 2.628260884878466
  statistics:
    noise:
      enabled: true
      accumulate_chunk: 16384
      init_variance: 1.0
      precision_eps: 1.0e-6
      ema_decay: 0.9999
      prior_weight: 50.0
      inflated_weight: 2500.0
      inflated_decay: null
      inflated_scale: 8.0
    prior:
      enabled: false
      init_variance: 1.0
      precision_eps: 1.0e-6
      tail_floor: 1.0e-5
      init_lowpass_cutoff: null

abinitio:
  engine:
    num_epochs: 1000
    init_particles_per_volume: 100
    init_lowpass_angstrom: 50
    solvent_mask: none
    solvent_mask_soft_edge_pixels: 5.0
    loss_ema_decay: 0.9
    pose_rms_ema_decay: 0.9
  solver:
    learning_rate: 1.0
    learning_rate_decay: 0.9995
    momentum: 0.9
  scheduler:
    schedule_check_interval_iters: 100
    confidence_threshold: 0.5
    convergence_patience: 3
    pose_translation_center_mode: auto
    increase_radius_step: 1
    auto_local_healpix_order: 4
    auto_local_assignment_change_threshold: 1.0
    trans_extent_scale: 3.0
    target_side_length_resolution: 10.0
    target_healpix_order: null
    pose_rotation_stability_factor: 1.0
    pose_translation_stability_factor: 0.5