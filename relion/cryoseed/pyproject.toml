[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryoseed"
dynamic = ["version"]
description = "Cryo-EM reconstruction toolkit"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "triton",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "mrcfile",
    "starfile",
    "PyYAML",
    "tqdm",
    "einops",
    "healpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
cryoseed = "cryoseed.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
cryoseed = ["config/defaults/*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "cryoseed._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]