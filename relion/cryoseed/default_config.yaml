io:
  star_path: ""
  data_path: ""
  ref_volume_path: ""
  output_path: outputs
  ssd_cache_root: ""

data:
  batch_size: 4
  num_workers: 0
  num_particles: 0
  image_size: 0
  angpix: 0.0
  particle_diameter: null
  default_optic_params:
    voltage_kv: null
    spherical_aberration_mm: null
    bfactor: null
    ctf_scale: null
    amplitude_contrast: null
    phase_shift_deg: null
  default_particle_params:
    defocus_u_angstrom: null
    defocus_v_angstrom: null
    defocus_angle_deg: null

logging:
  log_dir: ""
  log_prefix: cryoseed
  level: INFO

reconstruction:
  num_volumes: 1
  external_reconstruct: false
  full_backprojection: false
  requires_grad: false
  requires_accum: true
  backproject_chunk: 16384
  accumulate_chunk: 16384

statistics:
  use_noise: true
  use_prior: true
  init_variance: 1.0
  precision_eps: 1.0e-6
  tail_floor: 1.0e-5
  init_lowpass_cutoff: null

refinement:
  num_epochs: 50
  fsc_threshold: 0.143
  init_lowpass_angstrom: 30

scheduler:
  confidence_threshold: 0.1
  convergence_patience: 3
  fsc_resolution_improvement_threshold: 1.0e-3
  fsc_resolution_rebound_threshold: 1.0e-2
  trans_update_rms_threshold: 0.5
  increase_radius_step: 10
  increase_radius_aggressive_factor: 0.25
  increase_radius_aggressive_fsc_threshold: 0.2
  base_healpix_order: 3
  auto_local_healpix_order: 4
  use_cache: false
  cache_max_healpix_order: 4
  ssd_cache_min_side_length: 150
  trans_extent_scale: 3.0

pose_search:
  init_healpix_order: 2
  neighbor_steps: 2
  init_trans_grid_extent: 5
  trans_grid_samples: 5
  trans_grid_x_shift: 0
  trans_grid_y_shift: 0
  pose_chunk_factor: 2560
  max_candidates: -1
  mse_chunk: 8192
  candidate_select_threshold: 0.999
  renormalize_sel_prob: true
  oversampling_deduplicate: false
  ring_averaged_mse: false

reproduce:
  seed: 42
  deterministic: false